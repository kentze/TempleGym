name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: TempleGym

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TempleGym/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck types
        run: npx tsc --noEmit -p packages/types/tsconfig.json

      - name: Typecheck server
        run: npx tsc --noEmit -p apps/server/tsconfig.json

      - name: Unit tests
        run: npm test --workspace=apps/server
